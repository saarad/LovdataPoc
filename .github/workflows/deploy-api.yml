name: Deploy API to Azure App Service

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "LovdataPocApi/**"
      - ".github/workflows/deploy-api.yml"

permissions:
  contents: read

env:
  AZURE_WEBAPP_NAME: LovdataPoc
  AZURE_WEBAPP_URL: https://lovdatapoc-c4ajbfcxh7f0dpcd.westeurope-01.azurewebsites.net
  DOTNET_VERSION: 10.0.x
  NODE_VERSION: 20

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: LovdataPocApi/ClientApp/package-lock.json

      - name: Restore API dependencies
        run: dotnet restore LovdataPocApi/LovdataPocApi.csproj

      - name: Publish API and client
        run: >-
          dotnet publish LovdataPocApi/LovdataPocApi.csproj
          --configuration Release
          --no-restore
          --output ${{ runner.temp }}/lovdata-poc
          /p:UseAppHost=false

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ runner.temp }}/lovdata-poc

      - name: Verify API health
        run: |
          for attempt in {1..18}; do
            if curl --fail --silent --show-error "$AZURE_WEBAPP_URL/health"; then
              exit 0
            fi
            sleep 10
          done
          echo "API did not become healthy at $AZURE_WEBAPP_URL/health."
          exit 1

      - name: Publish deployment summary
        if: always()
        run: |
          {
            echo "## Azure App Service deployment"
            echo
            echo "- App Service: \`$AZURE_WEBAPP_NAME\`"
            echo "- API: $AZURE_WEBAPP_URL"
            echo "- Health: $AZURE_WEBAPP_URL/health"
            echo "- Commit: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
